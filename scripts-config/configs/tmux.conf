# tmux.conf - rav3ndust
# brings a 'wiredWM' feel to your tmux.
# it has a lot of bindings that have been adapted from wiredWM for this purpose.
# - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - 
# Enable 256-color support for TTY
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Enable mouse support (optional, useful for TTY resizing/scrolling)
set -g mouse on

# Reduce escape time for faster key response in TTY
set -sg escape-time 10

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# --- Keybindings (Adapted from i3) ---

# Run tmux commands
bind c command-prompt

# Navigate panes (like i3's $mod+j/k/l/semicolon)
bind j select-pane -L
bind k select-pane -D
bind l select-pane -U
bind semicolon select-pane -R

# Navigate panes with arrow keys (like i3's $mod+Left/Down/Up/Right)
bind Left select-pane -L
bind Down select-pane -D
bind Up select-pane -U
bind Right select-pane -R

# Move/swap panes (like i3's $mod+Shift+j/k/l/semicolon)
bind J swap-pane -s '{left-of}'
bind K swap-pane -s '{down-of}'
bind L swap-pane -s '{up-of}'
bind : swap-pane -s '{right-of}'

# Move panes with Shift+arrow keys (like i3's $mod+Shift+Left/Down/Up/Right)
bind S-Left swap-pane -s '{left-of}'
bind S-Down swap-pane -s '{down-of}'
bind S-Up swap-pane -s '{up-of}'
bind S-Right swap-pane -s '{right-of}'

# Split panes (like i3's $mod+h/v)
bind h split-window -h -c "#{pane_current_path}"
bind v split-window -v -c "#{pane_current_path}"

# Kill pane (like i3's $mod+Shift+q)
bind Q kill-pane

# Toggle pane zoom (like i3's $mod+f fullscreen)
bind f resize-pane -Z

# Toggle layout (like i3's $mod+e toggle split)
bind e select-layout "tiled"

# Resize mode (like i3's $mod+r, then j/k/l/semicolon or arrows)
bind r resize-pane -Z \; display-message "Resize mode: j/k/l/semicolon or arrows"
bind -r j resize-pane -L 10
bind -r k resize-pane -D 10
bind -r l resize-pane -U 10
bind -r semicolon resize-pane -R 10
bind -r Left resize-pane -L 10
bind -r Down resize-pane -D 10
bind -r Up resize-pane -U 10
bind -r Right resize-pane -R 10

# --- Color Scheme (Inspired by i3) ---

# Pane borders
set -g pane-active-border-style 'fg=#ff10f0,bg=default,bold'
set -g pane-border-style 'fg=#39ff14,bg=default,bold'

# Status bar (inspired by i3 bar's #ff10f0, #39FF14, #ff3131)
set -g status-style 'fg=#39FF14,bg=#000000'
set -g status-left "#[fg=#ff10f0,bg=#000000,bold] #S #[fg=#39FF14,bg=#000000] "
set -g status-right "#[fg=#ff10f0,bg=#000000,bold] %Y-%m-%d #[fg=#39FF14,bg=#000000] %H:%M "
set -g status-left-length 30
set -g status-right-length 50

# Window tabs
set -g window-status-current-style 'fg=#39FF14,bg=#ff10f0,bold'
set -g window-status-style 'fg=#ff3131,bg=#000000'

# Message line (e.g., for commands or resize mode)
set -g message-style 'fg=#39FF14,bg=#ff10f0,bold'

# --- Extra Tweaks for Cohesion ---

# Quick session switching (inspired by i3's workspace switching $mod+1-0)
bind 1 select-window -t 1
bind 2 select-window -t 2
bind 3 select-window -t 3
bind 4 select-window -t 4
bind 5 select-window -t 5
bind 6 select-window -t 6
bind 7 select-window -t 7
bind 8 select-window -t 8
bind 9 select-window -t 9
bind 0 select-window -t 10

# Reload config (like i3's $mod+Shift+c)
bind C-r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Open new terminal in current path (like i3's $mod+Return)
bind Return new-window -c "#{pane_current_path}"

# Smart pane switching with awareness of Vim splits
# (useful if you use Vim in TTY, inspired by i3's focus bindings)
bind -n C-h if-shell "tmux-vim-navigator" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "tmux-vim-navigator" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "tmux-vim-navigator" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "tmux-vim-navigator" "send-keys C-l" "select-pane -R"
