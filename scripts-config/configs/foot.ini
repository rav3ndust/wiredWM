[main]
font=JetBrainsMono:size=12  # jetbrains mono font, size 12 (you can adjust size if needed)
term=foot
shell=/bin/bash  # Adjust to your preferred shell

[cursor]
style=block
color=000000 ff10f0  # Text: black, Cursor: neon pink for visibility

[colors]
background=000000            # Black background for dark mode
foreground=ffffff            # White for main text
regular0=000000              # Black (color0: background or inactive elements)
regular1=ff3131              # Neon red (color1: alerts, inactive elements, visited links)
regular2=39ff14              # Neon green (color2: hyperlinks, active UI)
regular3=ff10f0              # Neon pink (color3: headings, active UI)
regular4=00ffff              # Cyan (color4: contrast UI elements)
regular5=ff10f0              # Neon pink (color5: reuse for emphasis)
regular6=39ff14              # Neon green (color6: reuse for consistency)
regular7=ffffff              # White (color7: main text or highlights)
bright0=666666               # Gray (for contrast in bright variant)
bright1=ff6666               # Brighter neon red (for alerts or emphasis)
bright2=66ff66               # Brighter neon green
bright3=ff66ff               # Brighter neon pink
bright4=66ffff               # Brighter cyan
bright5=ff66ff               # Brighter neon pink (reuse)
bright6=66ff66               # Brighter neon green (reuse)
bright7=ffffff               # White (unchanged for bright)
selection-foreground=ffffff  # White text on selection
selection-background=00ffff  # Cyan background for selections
urls=39ff14        # Neon green for URLs (like hyperlinks)
