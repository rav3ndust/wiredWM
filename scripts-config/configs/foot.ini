[main]
font=NotoMono:size=12        # noto mono font, size 12 (adjust size as you need)
term=foot
shell=/bin/bash              # you can adjust this value to use your preferred shell if you want

[cursor]
style=block
color=000000 ff10f0          # text: black, cursor: neon pink for visibility

[colors]
alpha=0.9                    # semi-transparent terminal windows
background=000000  
foreground=ffffff  
regular0=000000    
regular1=ff3131    
regular2=39ff14    
regular3=ff10f0    
regular4=00ffff    
regular5=ff10f0    
regular6=39ff14    
regular7=ffffff    
bright0=666666     
bright1=ff6666     
bright2=66ff66     
bright3=ff66ff     
bright4=66ffff     
bright5=ff66ff     
bright6=66ff66     
bright7=ffffff               
selection-foreground=ffffff  # white text on selection
selection-background=00ffff  # cyan background for selections
urls=39ff14                  # neon green for URLs (like hyperlinks)
