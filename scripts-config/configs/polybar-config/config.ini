[colors]
background = #000000
background-alt = #ff3131
foreground = #39ff14
primary = #ff10f0
secondary = #d3d3d3
alert = #ff1818
disabled = #707880

[bar/example]
width = 100%
height = 18pt
radius = 6

; dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

border-size = 4pt
border-color = #00000000

padding-left = 0
padding-right = 1

module-margin = 1

separator = |
separator-foreground = ${colors.disabled}

font-0 = Quicksand;2
; please note that 'pulseaudio' equals 'volume control'
modules-left = xworkspaces 
modules-right = wlan eth battery pulseaudio date tray 
cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

tray-position = right
; wm-restack = generic
; wm-restack = bspwm
 wm-restack = i3

; override-redirect = true

[module/now_playing]
; custom module to show 'now playing' media in the bar.
type = custom/script
exec = $HOME/now_playing.sh
interval = 1

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.black}
label-active-underline= ${colors.primary}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %{F#ff3131}%title:0:60:...%

[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = "volume "
format-volume-prefix-foreground = ${colors.secondary}
format-volume = <label-volume>

label-volume = %percentage%%

label-muted = muted
label-muted-foreground = ${colors.disabled}

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = %{F#F0C674}%ifname%%{F#707880} disconnected

[module/wlan]
inherit = network-base
interface-type = wireless
label-connected = %{F#d3d3d3}wireless:%{F-} %{F#39ff14}%essid% 
label-disconnected = %{F#d3d3d3}wireless:%{F-} %{F#ff073a} down
[module/eth]
inherit = network-base
interface-type = wired
label-connected = %{F#d3d3d3}ethernet:%{F-} %{F#39ff14}%essid%
label-disconnected = %{F#d3d3d3}ethernet:%{F-} %{F#ff073a}down
[module/date]
type = internal/date
interval = 1
; currently using USA 12-hour format. 
; TODO add options for 24hr-fmt as in our config for i3bar
date = %a, %b %d %Y %H:%M
date-alt = %m-%d-%Y %l:%M:%S %P

label = %date%
label-foreground = ${colors.primary}

; a few custom modules. 
; several courtesy of the "polybar-scripts" project on github: 
; https://github.com/polybar/polybar-scripts
; tray for showing system icons
[module/tray]
type = internal/tray
format = <tray>
tray-position = right
format-margin = 8px
tray-spacing = 8px
; battery module to display computer battery power. 
[module/battery]
type = internal/battery
; This is useful in case the battery never reports 100% charge
; Default: 100
full-at = 99

; format-low once this charge percentage is reached
; Default: 10
; New in version 3.6.0
low-at = 5

; Use the following command to list batteries and adapters:
; $ ls -1 /sys/class/power_supply/
battery = BAT0
adapter = ADP1

; If an inotify event haven't been reported in this many
; seconds, manually poll for new values.
;
; Needed as a fallback for systems that don't report events
; on sysfs/procfs.
;
; Disable polling by setting the interval to 0.
;
; Default: 5
poll-interval = 5

label-foreground = ${colors.primary}
label-charging = %{F#d3d3d3}battery%{F-} %percentage%%%{F#707880} charging 
label-discharging = %{F#d3d3d3}battery%{F-} %percentage%%%{F#707880} discharging 
label-full = %{F#d3d3d3}battery%{F-} %percentage%%%{F#707880} full
[settings]
screenchange-reload = true
pseudo-transparency = true
; vim:ft=dosini
