;==========================================================
;  nightshadeNeon polybar config
;  styled in our nightshadeNeon aesthetic for navi/wired
;==========================================================

[colors]
background = #ff0a0a0a
foreground = #00ffff
primary = #ff10f0
secondary = #39ff14
alert = #ff3131
disabled = #505050
border = #800080

[bar/main]
width = 100%
height = 18pt
radius = 8
fixed-center = true
background = ${colors.background}
foreground = ${colors.foreground}
border-size = 2pt
border-color = ${colors.border}
line-size = 2pt
padding-left = 1
padding-right = 1
module-margin = 0.7
separator = " | "
separator-foreground = ${colors.disabled}
font-0 = Noto Sans:style=Bold:size=10;2
font-1 = MaterialDesignIcons-Regular:size=10;2
font-2 = FontAwesome:size=10;2
wm-restack = i3
enable-ipc = true
override-redirect = false
dim-value = 1.0
tray-spacing = 6px
tray-padding = 4px
background-0 = ${colors.background}
underline-size = 1.5
underline-color = ${colors.primary}
border-top-size = 0
border-bottom-size = 2pt
border-bottom-color = ${colors.primary}
padding-top = 1
padding-bottom = 1

modules-left = wired-launcher xworkspaces xwindow
modules-center = date-1 date-2 date-3
modules-right = pulseaudio network battery tray custom/power

;----------------------------------------------------------
; modules
;----------------------------------------------------------

[module/wired-launcher]
type = custom/script
exec = echo ""
click-left = rofi -show combi -modi window,drun,run
format = <label>
format-background = ${colors.background}
format-foreground = ${colors.primary}
format-padding = 2

[module/xworkspaces]
type = internal/xworkspaces
format = <label-state>
label-active = %name%
label-active-foreground = ${colors.primary}
label-active-background = ${colors.background}
label-active-underline = ${colors.secondary}
label-active-padding = 1
label-occupied = %name%
label-occupied-foreground = ${colors.foreground}
label-occupied-padding = 1
label-urgent = %name%
label-urgent-foreground = ${colors.alert}
label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%
label-foreground = ${colors.alert}
label-padding = 2

[module/date-1]
type = internal/date
interval = 1
date = %a
label = %date%
label-foreground = ${colors.secondary}
click-left = st -e calcurse
label-padding = 2

[module/date-2]
type = internal/date
interval = 1
date = %H:%M
label = %date%
label-foreground = ${colors.secondary}
click-left = st -e tty-clock
label-padding = 2

[module/date-3]
type = internal/date
interval = 1
date = %b %d
label = %date%
label-foreground = ${colors.secondary}
click-left = gsimplecal
label-padding = 2

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <label-volume>
format-volume-prefix = " "
format-volume-prefix-foreground = ${colors.primary}
label-volume = %percentage%%
label-volume-foreground = ${colors.primary}
format-muted = <label-muted>
format-muted-prefix = " "
format-muted-prefix-foreground = ${colors.disabled}
label-muted = mute
label-muted-foreground = ${colors.disabled}
click-left = pamixer -t
click-right = pavucontrol
label-padding = 2

[module/network]
type = internal/network
interface-type = wireless
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-connected = " %signal%%"
label-connected-foreground = ${colors.primary}
label-disconnected = ""
label-disconnected-foreground = ${colors.alert}
click-left = st -e nmtui
label-padding = 2

[module/battery]
type = internal/battery
battery = BAT0
adapter = ADP1
full-at = 99
low-at = 15
poll-interval = 5
format-charging = <label-charging>
format-discharging = <label-discharging>
format-full = <label-full>
label-charging = "%percentage%% "
label-discharging = "%percentage%% "
label-full = "%percentage%% "
label-charging-foreground = ${colors.primary}
label-discharging-foreground = ${colors.primary}
label-full-foreground = ${colors.primary}
label-padding = 2

[module/tray]
type = internal/tray
format = <tray>
tray-spacing = 6px
format-margin = 4px
label-padding = 2

[module/custom/power]
type = custom/script
exec = echo ""
click-left = /usr/bin/power_menu
format = <label>
format-foreground = ${colors.primary}
format-background = ${colors.background}
format-padding = 2

[settings]
screenchange-reload = true
pseudo-transparency = false
