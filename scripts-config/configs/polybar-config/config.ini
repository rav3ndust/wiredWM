[colors]
background = #00000095
foreground = #00ffff
primary = #ff10f0
secondary = #39ff14
alert = #ff3131
disabled = #707880

[bar/example]
width = 100%
height = 18pt
radius = 10
background = #000000B2
foreground = #00ffff
line-size = 3pt
padding-left = 1
padding-right = 1
module-margin = 0.3
separator = |
separator-foreground = #707880
font-0 = MaterialDesignIcons-Regular:size=10;2:antialias=true
font-1 = Noto Sans:size=10;2:antialias=true
font-2 = FontAwesome:size=10;2:antialias=true
cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true
tray-spacing = 8px
wm-restack = i3
override-redirect = false
pseudo-transparency = true

modules-left = wired-launcher xworkspaces xwindow
modules-center = date-1 date-2 date-3
modules-right = pulseaudio network battery tray custom/power

[module/wired-launcher]
type = custom/script
exec = echo ""  
click-left = rofi -show combi -combi -modi window,drun,run modi combi
format = <label>
format-foreground = #00ffff
format-background = #000000B2
format-padding = 1
label = %output%

[module/xworkspaces]
type = internal/xworkspaces
label-active = %name%
label-active-foreground = #ff10f0
label-active-background = #000000B2
label-active-underline = #39ff14
label-active-padding = 1
label-occupied = %name%
label-occupied-foreground = #00ffff
label-occupied-padding = 1
label-urgent = %name%
label-urgent-foreground = #ff3131
label-urgent-background = #000000B2
label-urgent-padding = 1
label-empty = %name%
label-empty-foreground = #707880
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%
label-foreground = #ff3131

[module/date-1]
type = internal/date
interval = 1
date = %a
label = %date%
label-foreground = #39ff14
click-left = st -e calcurse

[module/date-2]
type = internal/date
interval = 1
date = %H:%M
label = %date%
label-foreground = #39ff14
click-left = st -e tty-clock

[module/date-3]
type = internal/date
interval = 1
date = %Y/%m/%d
label = %date%
label-foreground = #39ff14
click-left = gsimplecal

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <label-volume>
format-volume-prefix = " "  
format-volume-prefix-foreground = #ff10f0
label-volume = %percentage%%
label-volume-foreground = #ff10f0
format-muted = <label-muted>
format-muted-prefix = " "  
format-muted-prefix-foreground = #707880
label-muted = mute
label-muted-foreground = #707880
click-left = pamixer -t
click-right = pavucontrol

[module/network]
type = internal/network
interface-type = wireless
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-connected = " %signal%%"  
label-connected-foreground = #ff10f0
label-disconnected = ""  
label-disconnected-foreground = #ff3131
click-left = st -e nmtui

[module/battery]
type = internal/battery
battery = BAT0
adapter = ADP1
full-at = 99
low-at = 15
poll-interval = 5
format-charging = <label-charging>
format-discharging = <label-discharging>
format-full = <label-full>
label-charging = "%percentage%% "  
label-discharging = "%percentage%% "  
label-full = "%percentage%% "  
label-charging-foreground = #ff10f0
label-discharging-foreground = #ff10f0
label-full-foreground = #ff10f0

[module/tray]
type = internal/tray
format = <tray>
tray-spacing = 8px
format-margin = 8px

[module/custom/power]
type = custom/script
exec = echo ""  
click-left = /usr/bin/power_menu
format = <label>
format-foreground = #ff10f0
format-background = #000000B2
format-padding = 1
label = %output%

[settings]
screenchange-reload = true
pseudo-transparency = true
; vim:ft=dosini
